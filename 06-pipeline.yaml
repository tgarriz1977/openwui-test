apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: pipelines
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: rag-system
  name: pipelines
  namespace: rag-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pipelines
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: rag-system
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pipelines
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/part-of: rag-system
    spec:
      initContainers:
      - name: install-deps-and-fix-perms
        image: python:3.11-slim
        # 1. ESTE CORRE COMO ROOT PARA PODER HACER CHOWN
        securityContext:
          runAsUser: 0
        command:
        - sh
        - -c
        - |
          pip install --target=/pip_libs psycopg2-binary qdrant-client openai pydantic
          chown -R 1000:1000 /app/pipelines
          chmod -R 775 /app/pipelines
        volumeMounts:
        - mountPath: /pip_libs
          name: python-libs
        - mountPath: /app/pipelines
          name: pipelines-data
      containers:
      - name: pipelines
        image: ghcr.io/open-webui/pipelines:main
        env:
        - name: PYTHONPATH
          value: "/pip_libs"
        - name: PIPELINES_API_KEY
          valueFrom:
            secretKeyRef:
              key: api-key
              name: pipelines-secret
        - name: DATABASE_URL
          value: "postgresql://ragsystemuser:admin123@postgres:5432/colegio_tecnicos"
        - name: BEDROCK_URL
          value: "http://bedrock-gateway.rag-system.svc.cluster.local:80"
        - name: BEDROCK_API_KEY
          valueFrom:
            secretKeyRef:
              name: bedrock-gateway-secret
              key: api-key
        - name: BEDROCK_MODEL
          value: "global.anthropic.claude-sonnet-4-6"
        - name: QDRANT_URL
          value: "http://qdrant-service.rag-system.svc.cluster.local:6333"
        - name: QDRANT_COLLECTION
          value: "actas_colegio"
        ports:
        - containerPort: 9099
          name: http
        volumeMounts:
        - mountPath: /app/pipelines
          name: pipelines-data
        - mountPath: /pip_libs
          name: python-libs
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
      volumes:
      - name: pipelines-data
        persistentVolumeClaim:
          claimName: pipelines-storage
      - name: python-libs
        emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: rag-system
  name: pipelines-storage
  namespace: rag-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: gp3-delete
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: pipelines
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: rag-system
  name: pipelines-service
  namespace: rag-system
spec:
  ports:
    - name: http
      port: 9099
      protocol: TCP
      targetPort: 9099
  selector:
    app: pipelines
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: rag-system
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: rag-system
  name: pipelines-secret
  namespace: rag-system
type: Opaque
data:
